name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build assets
        run: pnpm run build
      - name: WordPress Plugin Deploy
        uses: debba/action-wordpress-plugin-deploy@develop
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: turbosmtp
          ASSETS_DIR: .wordpress-org/assets
          README_DIR: .wordpress-org/readme
      # Package the plugin exactly as deployed (same rsync + .distignore
      # logic as the deploy action) and attach it to the GitHub release.
      - name: Package plugin zip
        run: |
          mkdir -p /tmp/package/turbosmtp
          rsync -rc --exclude-from=.distignore ./ /tmp/package/turbosmtp/ --delete --delete-excluded
          cd /tmp/package
          zip -rq turbosmtp.zip turbosmtp
      - name: Create GitHub release with plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/package/turbosmtp.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes